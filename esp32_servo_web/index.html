<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32-S3 + PCA9685 Servo Controller</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .container { max-width: 1120px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #0b1220;
      border: 1px solid var(--card-border);
      font-size: 13px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warn);
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .dot.err { background: var(--danger); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    button {
      background: #273449;
      color: var(--text);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.06s, background 0.15s;
    }
    button:hover { background: #334155; }
    button:active { transform: scale(0.97); }
    button.primary { background: #0284c7; border-color: #38bdf8; }
    button.primary:hover { background: #0369a1; }
    button.danger { background: #7f1d1d; border-color: #ef4444; }
    button.danger:hover { background: #991b1b; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 14px;
    }
    .ch-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .ch-card.active { border-color: var(--accent); }
    .ch-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .ch-name { font-weight: 700; font-size: 15px; }
    .ch-role { font-size: 11px; color: var(--muted); }
    .angle-val {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 18px;
      color: var(--accent);
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      margin: 6px 0 10px;
    }
    .quick-row {
      display: flex;
      gap: 6px;
    }
    .quick-row button {
      flex: 1;
      padding: 6px 4px;
      font-size: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>ESP32-S3 + PCA9685 Servo Controller</h1>
        <div class="sub">GPIO 21 (SDA) / GPIO 47 (SCL) • Địa chỉ I2C 0x40 • PWM 50Hz</div>
      </div>
      <div class="status-pill">
        <span id="dot" class="dot"></span>
        <span id="statusText">Đang kiểm tra kết nối...</span>
      </div>
    </header>

    <div class="toolbar">
      <button class="primary" onclick="setAll(90)">Tất cả về 90° (Center)</button>
      <button onclick="setAll(0)">Tất cả 0°</button>
      <button onclick="setAll(180)">Tất cả 180°</button>
      <button class="danger" onclick="turnOff(-1)">Thả lỏng tất cả (OFF)</button>
      <button onclick="refreshStatus()">Kiểm tra lại (PING)</button>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <script>
    const labels = [
      "Kênh 0 (Trục 1 / Test)", "Kênh 1 (Trục 2)", "Kênh 2 (Trục 3)",
      "Kênh 3 (Trục 4)", "Kênh 4 (Trục 5)", "Kênh 5 (Trục 6)",
      "Kênh 6", "Kênh 7", "Kênh 8", "Kênh 9", "Kênh 10", "Kênh 11",
      "Kênh 12", "Kênh 13", "Kênh 14", "Kênh 15"
    ];

    const grid = document.getElementById("grid");
    for (let ch = 0; ch < 16; ch++) {
      const card = document.createElement("div");
      card.className = "ch-card";
      card.id = `card-${ch}`;
      card.innerHTML = `
        <div class="ch-head">
          <div>
            <div class="ch-name">CH ${ch}</div>
            <div class="ch-role">${labels[ch]}</div>
          </div>
          <div class="angle-val" id="val-${ch}">90°</div>
        </div>
        <input type="range" min="0" max="180" value="90" id="slider-${ch}"
          oninput="previewAngle(${ch}, this.value)"
          onchange="sendServo(${ch}, this.value)" />
        <div class="quick-row">
          <button onclick="sendServo(${ch}, 0)">0°</button>
          <button onclick="sendServo(${ch}, 90)">90°</button>
          <button onclick="sendServo(${ch}, 180)">180°</button>
          <button class="danger" onclick="turnOff(${ch})">OFF</button>
        </div>
      `;
      grid.appendChild(card);
    }

    function previewAngle(ch, val) {
      document.getElementById(`val-${ch}`).textContent = `${val}°`;
    }

    async function sendServo(ch, angle) {
      angle = Number(angle);
      document.getElementById(`slider-${ch}`).value = angle;
      document.getElementById(`val-${ch}`).textContent = `${angle}°`;
      document.getElementById(`card-${ch}`).classList.add("active");
      const res = await fetch("/api/servo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ch, angle })
      });
      const data = await res.json();
      updateReply(data);
    }

    async function setAll(angle) {
      for (let ch = 0; ch < 16; ch++) {
        document.getElementById(`slider-${ch}`).value = angle;
        document.getElementById(`val-${ch}`).textContent = `${angle}°`;
        document.getElementById(`card-${ch}`).classList.add("active");
      }
      const res = await fetch("/api/all", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ angle })
      });
      updateReply(await res.json());
    }

    async function turnOff(ch) {
      if (ch < 0) {
        for (let i = 0; i < 16; i++) {
          document.getElementById(`card-${i}`).classList.remove("active");
        }
      } else {
        document.getElementById(`card-${ch}`).classList.remove("active");
      }
      const res = await fetch("/api/off", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ch })
      });
      updateReply(await res.json());
    }

    function updateReply(data) {
      const dot = document.getElementById("dot");
      const txt = document.getElementById("statusText");
      if (data.ok) {
        dot.className = "dot ok";
        txt.textContent = data.reply || "OK";
      } else {
        dot.className = "dot err";
        txt.textContent = data.error || "Lỗi kết nối";
      }
    }

    async function refreshStatus() {
      const res = await fetch("/api/status");
      const data = await res.json();
      const dot = document.getElementById("dot");
      const txt = document.getElementById("statusText");
      if (data.ok) {
        dot.className = "dot ok";
        txt.textContent = `${data.port} • ${data.reply}`;
        data.angles.forEach((a, i) => {
          document.getElementById(`slider-${i}`).value = a;
          document.getElementById(`val-${i}`).textContent = `${a}°`;
          document.getElementById(`card-${i}`).classList.toggle("active", data.enabled[i]);
        });
      } else {
        dot.className = "dot err";
        txt.textContent = `${data.port} • ${data.error}`;
      }
    }

    refreshStatus();
  </script>
</body>
</html>
